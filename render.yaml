# Render Blueprint: the whole deployed app as one Docker web service.
# Render → New → Blueprint → pick this repo. Secrets (sync: false) are asked for on first deploy.
services:
  - type: web
    name: cad-viewer
    runtime: docker
    region: oregon        # keep next to the Neon database (AWS us-west-2)
    plan: free            # sleeps after ~15 min idle; the next request takes ~1 min to wake it
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true      # deploy on every push to main
    envVars:
      - key: RAILS_MASTER_KEY      # contents of web/config/master.key
        sync: false
      - key: DATABASE_URL          # Neon direct connection string (postgresql://...?sslmode=require)
        sync: false
      # Backblaze B2 (S3-compatible API), see web/config/storage.yml
      - key: S3_ENDPOINT           # https://s3.us-west-004.backblazeb2.com (from the bucket page)
        sync: false
      - key: S3_REGION             # us-west-004 (the part of the endpoint after "s3.")
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID      # B2 application key: keyID
        sync: false
      - key: S3_SECRET_ACCESS_KEY  # B2 application key: applicationKey
        sync: false
