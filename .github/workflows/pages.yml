# Builds the viewer in demo mode (no VITE_API_URL) and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/pages.yml"]
  workflow_dispatch: # also allow running it by hand from the Actions tab

permissions:
  contents: read
  pages: write    # publish to Pages
  id-token: write # prove to Pages that this workflow is allowed to publish

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Project sites live at https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional "Full app" link to the deployed Rails app. Set it under repo Settings →
          # Secrets and variables → Actions → Variables → FULL_APP_URL (e.g. the Render URL).
          VITE_FULL_APP_URL: ${{ vars.FULL_APP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
