default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
  workers:
    # One tessellation at a time: the free Render instance has 512 MB, and OCCT can use a lot
    # of it on big files.
    - queues: "*"
      threads: 1
      processes: 1
      polling_interval: 1
