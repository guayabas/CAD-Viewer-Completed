test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]

# S3-compatible object storage for production: Backblaze B2 (free 10 GB, no card, hard caps
# under Caps & Alerts). Any S3-compatible service works with the same settings, e.g. for B2:
#   S3_ENDPOINT=https://s3.us-west-004.backblazeb2.com   S3_REGION=us-west-004
# (the region is the part of the endpoint after "s3.").
s3:
  service: S3
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  region: <%= ENV["S3_REGION"] %>
  bucket: <%= ENV["S3_BUCKET"] %>
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  # Newer aws-sdk versions add CRC checksums that not every S3-compatible service accepts;
  # only send them when the operation requires one.
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"
